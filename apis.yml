aid: corca
name: Corca
description: >-
  Corca is an AI-native, collaborative workspace for mathematics — a browser-based
  editor that lets people write math naturally (without special syntax), run
  calculations in real time, and collaborate the way teams do in Figma or Google
  Docs. Typing keywords like "sum" or "integral" surfaces the right symbols and
  functions, documents import from and export to LaTeX, and built-in AI helps solve
  problems, manipulate expressions, and generate code without switching tools. It
  is used for lab research, lecture creation, team knowledge bases, and publishing
  academic work. Founded in 2023 and based in New York, Corca raised a $7.8M round
  (led by NEA, with Bloomberg Beta, NVIDIA's NVentures, Daft Capital, Slow Ventures,
  Liquid 2, Path Ventures, and Mana Ventures). The product is a consumer/team SaaS
  application; no public developer API, SDK, or OpenAPI surface is published as of
  this profile.
